name: morrie150-exact-artifact-qualification
on:
  push:
    branches: ['ci/morrie150-20261018']
permissions:
  contents: write
concurrency:
  group: morrie150-notary-609d2fbb
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Check no-submit and credential-isolation guards
        run: python3 -m unittest discover -s scripts -p test_ci_go150_qualify.py -v
      - name: Download fixed already-signed Go150 input from private draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/go150-input"
          gh release download morrie-go150-ci-20261018 --repo "$GITHUB_REPOSITORY" --pattern Everything-Go-0.2.150-morrie-x64-notary-input.zip --dir "$RUNNER_TEMP/go150-input"
      - name: Verify source, original Developer ID signature and exact input hash
        run: python3 scripts/ci_morrie150_qualify.py verify "$RUNNER_TEMP/go150-input/Everything-Go-0.2.150-morrie-x64-notary-input.zip" "$RUNNER_TEMP/go150-safe-output"
      - name: Read authorized fresh Go150 submission with existing CI credential; never submit
        env:
          APPSTORE_CONNECT_API_KEY_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}
          APPSTORE_CONNECT_API_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_API_ISSUER_ID }}
          APPSTORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APPSTORE_CONNECT_API_KEY_P8_BASE64 }}
        run: python3 scripts/ci_morrie150_qualify.py qualify "$RUNNER_TEMP/go150-input/Everything-Go-0.2.150-morrie-x64-notary-input.zip" "$RUNNER_TEMP/go150-safe-output"
      - name: Return only allowlisted receipt and qualified package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morrie150-ci-qualification
          path: |
            ${{ runner.temp }}/go150-safe-output/input-verified.json
            ${{ runner.temp }}/go150-safe-output/go150-ci-receipt.json
            ${{ runner.temp }}/go150-safe-output/Everything-Go-0.2.150-morrie-ci-qualified-x64.zip
          if-no-files-found: error
          retention-days: 7
